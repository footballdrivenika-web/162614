<!doctype html>
<html lang="ka">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Ibsu's Secret Page</title>

  <!-- Georgian-friendly font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#f3f3f3;
      --text:#222;
      --muted:#7a7a7a;
      --card:#ffffff;
      --border:#e7e7e7;
      --shadow: 0 8px 24px rgba(0,0,0,.06);
      --radius: 14px;
      --radius-pill: 999px;
      --primary:#111;
      --disabled:#d7d7d7;
      --disabled-text:#9a9a9a;
      --accent-soft:#eef5ff;
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family:"Noto Sans Georgian", system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background:var(--bg);
      color:var(--text);
    }

    .page{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:40px 16px;
    }

    .wrap{
      width:min(560px, 100%);
      text-align:center;
    }

    .logo{
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:10px;
      margin-bottom:18px;
    }

    .mark{
      width:56px;
      height:56px;
      display:grid;
      place-items:center;
    }

    .brand{
      font-size:12px;
      letter-spacing:.8px;
      color:#444;
      font-weight:600;
      margin-top:-6px;
    }

    h1{
      margin:10px 0 22px;
      font-size:30px;
      line-height:1.1;
      font-weight:700;
      color:#1a1a1a;
    }

    .field{
      width:min(520px, 100%);
      margin:0 auto 16px;
    }

    .input{
      width:100%;
      height:54px;
      border-radius:12px;
      border:1px solid var(--border);
      background:var(--card);
      padding:0 16px;
      outline:none;
      font-size:15px;
      color:#222;
    }
    .input::placeholder{color:#9b9b9b}

.btn{
  width:100%;
  height:54px;
  border-radius:10px;
  border:none;
  background:#111;
  color:#fff;
  font-size:15px;
  font-weight:600;
  cursor:pointer;
}


    .label{
      width:min(520px, 100%);
      margin:14px auto 10px;
      text-align:left;
      font-size:13px;
      color:#2a2a2a;
      font-weight:600;
    }

    .lang{
      width:min(520px, 100%);
      margin:0 auto 14px;
      background:var(--card);
      border:1px solid var(--border);
      border-radius:var(--radius-pill);
      box-shadow:var(--shadow);
      display:flex;
      overflow:hidden;
    }

    .lang button{
      flex:1;
      height:44px;
      border:0;
      background:transparent;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      font-size:14px;
      color:#222;
      cursor:pointer;
      font-weight:600;
    }

    .lang button.active{
      background:var(--accent-soft);
    }

    .flag{
      width:18px;
      height:18px;
      border-radius:999px;
      display:grid;
      place-items:center;
      font-size:14px;
    }

    .stores{
      display:flex;
      gap:10px;
      justify-content:center;
      margin:10px 0 18px;
      flex-wrap:wrap;
    }

    .badge{
      height:36px;
      min-width:140px;
      border-radius:8px;
      background:#111;
      color:#fff;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:0 12px;
      gap:10px;
      font-size:12px;
      user-select:none;
    }

    .badge small{
      display:block;
      font-size:9px;
      opacity:.85;
      line-height:1;
      margin-bottom:2px;
    }
    .badge span{
      display:block;
      font-weight:700;
      font-size:12px;
      line-height:1;
      letter-spacing:.2px;
    }

    .footer{
      margin-top:6px;
      color:#333;
      font-weight:600;
      font-size:13px;
    }

    .footer a{
      display:inline-block;
      margin-top:6px;
      color:#111;
      text-decoration:none;
      font-weight:500;
      font-size:12px;
    }
    .footer a:hover{text-decoration:underline}

    /* small screens */
    @media (max-width:420px){
      h1{font-size:26px}
      .badge{min-width:150px}
    }
  </style>
</head>

<body>
  <main class="page">
    <section class="wrap" aria-label="Login">
 <div class="logo">
  <img src="images/Group 1015.png" alt="INI.GE Logo" class="logo-img">
 
</div>


      <h1>ელექტრონული სერვისების<br>სისტემა</h1>

      <div class="field">
        <input id="codeInput" class="input" type="text" placeholder="საიდენტიფიკაციო სახელი" />
      </div>

      <div class="field">
        <button id="continueBtn" class="btn" type="button">გაგრძელება</button>
      </div>

      <div class="label">დაგავიწყდათ მონაცემები?</div>

      <div class="lang" role="tablist" aria-label="Language">
        <button class="active" type="button" role="tab" aria-selected="true">
          <span class="flag" aria-hidden="true">🇬🇪</span>
          ქართული
        </button>
        <button type="button" role="tab" aria-selected="false">
          <span class="flag" aria-hidden="true">🇬🇧</span>
          English
        </button>
      </div>

      <div class="stores" aria-label="Store badges">
        <div class="badge" role="img" aria-label="Download on the App Store (mock)">
          <div aria-hidden="true"></div>
          <div>
            <small>Download on the</small>
            <span>App Store</span>
          </div>
        </div>

        <div class="badge" role="img" aria-label="Get it on Google Play (mock)">
          <div aria-hidden="true">▶</div>
          <div>
            <small>GET IT ON</small>
            <span>Google Play</span>
          </div>
        </div>
      </div>

      <div class="footer">
        ვიდეო ინსტრუქცია
        <br />
        <a href="#" aria-label="Video Instruction link">Video Instruction</a>
      </div>
    </section>
  </main>

  <script>
    const input = document.getElementById("codeInput");
const button = document.getElementById("continueBtn");

button.addEventListener("click", function() {
    const code = input.value.trim();

    if(code === "162614"){
        window.location.href = "valentine.html";
    } else {
        alert("არასწორი კოდი"); // wrong code
    }
});

// optional: allow pressing Enter
input.addEventListener("keypress", function(e){
    if(e.key === "Enter"){
        button.click();
    }
});
    
    const tabs = document.querySelectorAll(".lang button");
    tabs.forEach(btn => {
      btn.addEventListener("click", () => {
        tabs.forEach(b => (b.classList.remove("active"), b.setAttribute("aria-selected","false")));
        btn.classList.add("active");
        btn.setAttribute("aria-selected","true");
      });
    });
  </script>
</body>
</html>
